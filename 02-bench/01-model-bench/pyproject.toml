[project]
name = "model-bench"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0",
    "ollama>=0.6.3",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project.scripts]
model-bench = "model_bench.webapp:main"
