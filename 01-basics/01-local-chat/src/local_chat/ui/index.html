<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>local-chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #d9dde5;
    --user: #dbe8ff; --assistant: #ffffff; --accent: #2f6fed; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1b1f27; --text: #e6e8ee; --muted: #9aa3b2; --border: #2c323d;
      --user: #25395f; --assistant: #1b1f27; --accent: #6b9bff; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 15px/1.55 "Segoe UI", "Malgun Gothic", sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 15px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  #settings { padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
              display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
  #settings label { display: flex; gap: 6px; align-items: center; }
  #settings select, #settings input { font: inherit; padding: 3px 6px; border-radius: 6px;
              border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  #settings input { width: 78px; }
  #settings select { max-width: 260px; }
  #settings :disabled { opacity: .5; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--border);
         white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.error { color: var(--danger); }
  details.think { margin-bottom: 8px; padding-left: 10px; border-left: 3px solid var(--border);
                  color: var(--muted); font-size: 13.5px; }
  details.think summary { cursor: pointer; user-select: none; }
  details.think .think-body { margin-top: 4px; }
  #status { padding: 4px 16px; color: var(--muted); font-size: 12.5px; min-height: 22px; }
  form { display: flex; gap: 8px; padding: 10px 16px 14px; background: var(--panel); border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; height: 54px; padding: 8px 10px; border-radius: 8px; font: inherit;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button { padding: 0 18px; border-radius: 8px; border: 1px solid var(--border); font: inherit; cursor: pointer;
           background: var(--accent); color: #fff; }
  button#stop { background: transparent; color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header><h1 id="title">local-chat</h1><span id="info"></span></header>
<div id="settings">
  <label>모델 <select id="model" disabled></select></label>
  <label>num_ctx <input id="numctx" type="number" min="4096" max="8192" step="512" disabled></label>
  <label>temperature <input id="temp" type="number" min="0" max="2" step="0.1" disabled></label>
</div>
<div id="log" aria-live="polite"></div>
<div id="status"></div>
<form id="form">
  <textarea id="input" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)" autofocus></textarea>
  <button id="send" type="submit" disabled>보내기</button>
  <button id="stop" type="button" disabled>중단</button>
</form>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const stopBtn = document.getElementById("stop");
  const statusEl = document.getElementById("status");
  let current = null;   // 지금 채워지는 답변 말풍선
  let thinkEl = null;   // 그 답변의 사고 과정 블록(사고 과정이 올 때만 만든다)
  const modelSel = document.getElementById("model");
  const numctxEl = document.getElementById("numctx");
  const tempEl = document.getElementById("temp");
  let busy = false;
  let locked = false;   // 모델 전환·옵션 적용 중
  let ready = false;   // pywebview 브리지가 준비되면 true. 그 전에는 보내지 않는다
  let initStarted = false;
  let seq = 0;   // 보낼 때마다 올린다. 늦게 돌아온 응답이 다른 질문의 화면을 건드리지 못하게 한다

  function refreshControls() {
    sendBtn.disabled = busy || locked || !ready;
    stopBtn.disabled = !busy;
    const off = busy || locked || !ready;   // 답변 중·적용 중에는 모델과 옵션을 바꿀 수 없다
    modelSel.disabled = numctxEl.disabled = tempEl.disabled = off;
  }

  function setBusy(b) {
    busy = b;
    refreshControls();
  }

  function setLocked(b) {
    locked = b;
    refreshControls();
  }

  function addMsg(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;   // textContent: 모델 출력을 HTML로 해석하지 않는다
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function ensureThink() {
    if (!thinkEl) {
      thinkEl = document.createElement("details");
      thinkEl.className = "think";
      thinkEl.open = true;   // 생각하는 동안은 펼쳐 둔다
      const summary = document.createElement("summary");
      summary.textContent = "생각 중…";
      const body = document.createElement("div");
      body.className = "think-body";
      thinkEl.append(summary, body);
      current.insertBefore(thinkEl, current.firstChild);
    }
    return thinkEl;
  }

  function collapseThink() {   // 첫 답 토큰에서 한 번만 접는다. 그 뒤 사용자가 펴면 그대로 둔다(미리 접어 둔 경우도 같다)
    if (thinkEl && !thinkEl.dataset.collapsed) {
      thinkEl.open = false;
      thinkEl.dataset.collapsed = "1";
      thinkEl.querySelector("summary").textContent = "생각 과정";
    }
  }

  // 파이썬이 evaluate_js로 부른다
  window.onChatEvent = function (ev) {
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    if (ev.type === "thinking") {
      if (current) ensureThink().querySelector(".think-body").appendChild(document.createTextNode(ev.text));   // 텍스트 노드: HTML로 해석하지 않는다
    } else if (ev.type === "token") {
      if (current) {
        collapseThink();
        current.appendChild(document.createTextNode(ev.text));
      }
    } else if (ev.type === "done") {
      statusEl.textContent = ev.eval_count + "토큰 · " + Number(ev.tok_s).toFixed(1) + " tok/s";
      finish();
    } else if (ev.type === "stopped") {
      statusEl.textContent = "중단했습니다";
      finish();
    } else if (ev.type === "error") {
      if (current) {
        current.classList.add("error");
        current.appendChild(document.createTextNode((current.textContent ? "\n" : "") + "[오류: " + ev.message + "]"));
      }
      statusEl.textContent = "오류(" + ev.kind + ")";
      finish();
    }
    if (nearBottom) log.scrollTop = log.scrollHeight;
  };

  function finish() {
    if (thinkEl) thinkEl.querySelector("summary").textContent = "생각 과정";   // 답이 없이 끝나도 펼친 채로 둔다
    current = null;
    thinkEl = null;
    setBusy(false);
    input.focus();
  }

  function bridgeReady() {
    return !!(window.pywebview && window.pywebview.api);
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    if (!ready || !bridgeReady()) {
      statusEl.textContent = "준비 중입니다. 잠시 뒤에 다시 보내세요.";
      return;
    }
    if (locked) return;   // 모델을 바꾸는 중에는 보내지 않는다
    setBusy(true);
    statusEl.textContent = "";
    const id = ++seq;
    const userEl = addMsg("user", text);
    const bubble = current = addMsg("assistant", "");
    thinkEl = null;
    input.value = "";
    let r;
    try {
      r = await window.pywebview.api.send(text);
    } catch (e) {   // 브리지 호출이 실패하면 어떤 요청도 시작되지 않았다
      r = { ok: false, reason: "bridge" };
    }
    if (r.ok) return;
    // 거절되거나 실패했다. 이 질문이 아직 진행 중인 턴일 때만 화면을 되돌린다.
    // 그 사이 중단됐거나 다음 질문이 시작됐다면 늦게 온 거절이 남의 화면을 지우지 않게 건드리지 않는다.
    if (id !== seq || current !== bubble) return;
    log.removeChild(bubble); log.removeChild(userEl);
    current = null; thinkEl = null; input.value = text; setBusy(false);
    statusEl.textContent = r.reason === "busy" ? "이전 답변을 처리 중입니다."
      : r.reason === "switching" ? "모델을 바꾸는 중입니다. 잠시 뒤에 다시 보내세요." : "보내지 못했습니다. 다시 시도하세요.";
  }

  document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  stopBtn.addEventListener("click", () => { if (bridgeReady()) window.pywebview.api.stop(); });

  let shown = null;   // 화면에 반영된 설정(모델·옵션). 거절되면 이 값으로 되돌린다

  function renderInfo(info) {
    shown = info;
    document.getElementById("title").textContent = "local-chat · " + info.client;
    document.getElementById("info").textContent = info.model + " · num_ctx " + info.num_ctx + " · temperature " + info.temperature +
      " · " + (info.think ? "사고 과정 표시" : "사고 과정 없음");
    modelSel.value = info.model;
    numctxEl.value = info.num_ctx;
    tempEl.value = info.temperature;
  }

  function fillModels(data) {
    modelSel.textContent = "";
    for (const m of data.models) {
      const opt = document.createElement("option");
      opt.value = m.name;
      // 목록에는 모두 보이되 채팅 못 하는 모델은 고를 수 없다. 확인하지 못한 모델(null)은 고르는 순간 서버가 다시 확인한다
      opt.textContent = m.chat === false ? m.name + " (채팅 불가 · 임베딩)" : m.chat === null ? m.name + " (확인 안 됨)" : m.name;
      opt.disabled = m.chat === false;
      modelSel.appendChild(opt);
    }
  }

  async function applyChange(call, okMessage) {
    setLocked(true);
    let r;
    try {
      r = await call();
    } catch (e) {
      r = { ok: false, message: "적용하지 못했습니다." };
    }
    if (r.ok) {
      renderInfo(r.info);
      statusEl.textContent = okMessage ? okMessage(r) : "";
    } else {
      // 거절되거나 응답이 오지 않았다. 서버가 실제로 쓰는 값을 다시 읽어 화면을 맞춘다(응답만 잃고 서버에서는 바뀌었을 수 있다)
      try {
        renderInfo(await window.pywebview.api.info());
      } catch (e) {
        renderInfo(shown);
      }
      statusEl.textContent = r.message || "적용하지 못했습니다.";
    }
    setLocked(false);
  }

  modelSel.addEventListener("change", () => {
    const name = modelSel.value;
    if (!bridgeReady() || name === shown.model) return;
    applyChange(() => window.pywebview.api.set_model(name), (r) =>
      "모델을 " + name + "(으)로 바꿨습니다." + (r.unloaded === false ? " (이전 모델을 내리지 못했습니다)" : ""));
  });

  function commitOptions() {
    if (!bridgeReady()) return;
    const num = (el) => (el.value.trim() === "" ? null : Number(el.value));   // 빈 값을 0으로 읽지 않는다
    applyChange(() => window.pywebview.api.set_options(num(numctxEl), num(tempEl)), () => "옵션을 바꿨습니다.");
  }
  numctxEl.addEventListener("change", commitOptions);
  tempEl.addEventListener("change", commitOptions);

  async function init() {
    if (ready || initStarted || !bridgeReady()) return;
    initStarted = true;   // 이벤트와 직접 호출이 겹쳐도 한 번만 한다
    try {
      fillModels(await window.pywebview.api.models());
      renderInfo(await window.pywebview.api.info());
      ready = true;
      refreshControls();   // 보내기 버튼과 설정 입력을 연다
    } catch (e) {
      initStarted = false;   // 다음 시도(pywebviewready)에서 다시 한다
    }
  }
  window.addEventListener("pywebviewready", init);
  init();   // 이벤트가 이미 지나갔을 때를 대비한다
</script>
</body>
</html>
