[project]
name = "env-check"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ollama>=0.6.3",
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
env-check = "env_check.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
